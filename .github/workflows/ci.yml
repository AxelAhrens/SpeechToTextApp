name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Check privacy logs
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build
        run: swift build
      - name: Test
        run: swift test
