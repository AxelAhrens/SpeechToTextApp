name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Check privacy logs
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package local macOS app
        run: bash Scripts/package-local-app.sh
      - name: Check app bundle
        run: |
          test -x .build/local/SpeechToTextApp.app/Contents/MacOS/SpeechToTextApp
          codesign --verify --strict --verbose=2 .build/local/SpeechToTextApp.app
      - name: Smoke-test packaged app launch (no API calls)
        run: python3 Scripts/smoke-test-local-app.py --seconds 5
